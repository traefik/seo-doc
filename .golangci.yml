version: "2"
linters:
  default: all
  disable:
    - depguard
    - cyclop
    - dupl
    - err113
    - exhaustive
    - exhaustruct
    - forbidigo
    - gosec
    - lll
    - mnd
    - nestif
    - nlreturn
    - noctx
    - paralleltest
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - testpackage
    - tparallel
    - varnamelen
    - wrapcheck
    - wsl
  exclusions:
    generated: lax
    rules:
      - linters:
          - funlen
        path: (.+)_test.go
      - path: version.go
        text: (version|commit|date) is a global variable
      - linters:
          - musttag
        path: .*/src/encoding/xml/xml.go
      - path: (.+)\.go$
        text: 'ST1000: at least one file in a package should have a package comment'
      - path: (.+)\.go$
        text: 'package-comments: should have a package comment'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
